<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VLM Social Costmap — Animated Demo</title>
<style>
:root {
  --bg:#070b14; --surface:#0e1626; --surface2:#121d31; --line:#26364d;
  --text:#e6edf7; --muted:#9fb0c5;
  --cyan:#67e8f9; --green:#5eead4; --amber:#facc15; --red:#f87171;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; background:var(--bg); color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
#app { display:grid; grid-template-rows:auto 1fr auto; height:100vh;
  padding:10px 14px; gap:8px; }

/* header */
#header { display:flex; align-items:center; gap:12px; }
#header h1 { font-size:1rem; color:var(--cyan); letter-spacing:.06em;
  text-transform:uppercase; font-weight:800; }
#dots { display:flex; gap:7px; margin-left:auto; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--line);
  transition:background .3s,transform .3s; }
.dot.active { background:var(--cyan); transform:scale(1.3); }
.hbtn { background:transparent; border:1px solid var(--line); color:var(--muted);
  padding:3px 12px; border-radius:6px; cursor:pointer; font-size:.78rem; }
.hbtn:hover { border-color:var(--cyan); color:var(--cyan); }

/* main */
#main { display:grid; grid-template-columns:1fr 1.8fr; gap:10px; min-height:0; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; display:flex; flex-direction:column; gap:7px;
  min-height:0; overflow:hidden; }
.ptitle { font-size:.68rem; color:var(--cyan); text-transform:uppercase;
  letter-spacing:.1em; font-weight:700; flex-shrink:0; }

/* left column */
#leftCol { display:grid; grid-template-rows:1fr auto; gap:10px; min-height:0; }
#cameraImg { width:100%; flex:1; min-height:0; object-fit:contain;
  border-radius:6px; opacity:0; transition:opacity .5s; display:block; }
#sceneText { font-size:.78rem; color:var(--muted); font-style:italic;
  flex-shrink:0; line-height:1.4; }
#navAdvice { font-size:.8rem; color:var(--amber); padding:6px 8px;
  background:rgba(250,204,21,.07); border:1px solid rgba(250,204,21,.2);
  border-radius:6px; flex-shrink:0; }

/* right column: costmap canvas */
#rightCol { display:flex; flex-direction:column; gap:8px; min-height:0; }
#mapWrap { flex:1; min-height:0; position:relative; }
#globalCanvas { width:100%; height:100%; display:block;
  image-rendering:pixelated; border-radius:6px; }
#phaseLabel { position:absolute; top:8px; left:8px;
  font-size:.72rem; color:var(--cyan); background:rgba(7,11,20,.8);
  padding:3px 8px; border-radius:4px; pointer-events:none; }

/* legend + metrics */
#legend { display:flex; gap:12px; flex-shrink:0; }
.lchip { display:flex; align-items:center; gap:5px;
  font-size:.68rem; color:var(--muted); }
.lline { width:18px; height:2px; display:inline-block; }
#metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; flex-shrink:0; }
.mcard { background:var(--surface2); border:1px solid var(--line); border-radius:6px;
  padding:6px 8px; }
.mcard h4 { font-size:.63rem; color:var(--muted); margin-bottom:3px; }
.mcard .mval { font-size:.9rem; font-weight:800; }
.mval.base { color:var(--red); }
.mval.enh  { color:var(--green); }
.mval.delta { color:var(--amber); }

/* footer */
#footer { display:flex; align-items:center; gap:14px; padding:0 2px; }
#scenTitle { font-size:1rem; font-weight:800; white-space:nowrap; }
#scenSummary { font-size:.8rem; color:var(--muted); flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#progressBar { width:160px; height:3px; background:var(--line);
  border-radius:2px; flex-shrink:0; }
#progressFill { height:100%; background:var(--cyan); border-radius:2px;
  width:0%; transition:width .08s linear; }
#kbhints { font-size:.68rem; color:var(--line); white-space:nowrap; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>VLM Semantic Costmap — Animated Path Demo</h1>
    <div id="dots"></div>
    <button class="hbtn" id="pauseBtn">⏸ Pause</button>
    <button class="hbtn" id="fsBtn">⛶ Fullscreen</button>
  </div>

  <div id="main">
    <div id="leftCol">
      <div class="panel">
        <div class="ptitle">Robot Camera Frame</div>
        <img id="cameraImg" src="" alt="">
        <div id="sceneText"></div>
        <div id="navAdvice"></div>
      </div>
    </div>

    <div id="rightCol">
      <div class="panel" style="flex:1;min-height:0;">
        <div class="ptitle">Global Costmap · Animated Path Comparison</div>
        <div id="mapWrap">
          <canvas id="globalCanvas"></canvas>
          <div id="phaseLabel">Costmap</div>
        </div>
      </div>
      <div id="legend">
        <div class="lchip">
          <span class="lline" style="border-top:2px dashed #38bdf8;"></span>Baseline path
        </div>
        <div class="lchip">
          <span class="lline" style="background:#f8fafc;"></span>VLM-enhanced path
        </div>
        <div class="lchip">
          <span style="color:#67e8f9;font-size:.9rem;">▲</span>Robot
        </div>
        <div class="lchip">
          <span style="color:#22c55e;font-size:.8rem;">●</span>Start
        </div>
        <div class="lchip">
          <span style="color:#facc15;font-size:.9rem;">★</span>Goal
        </div>
      </div>
      <div id="metrics"></div>
    </div>
  </div>

  <div id="footer">
    <div id="scenTitle"></div>
    <div id="scenSummary"></div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="kbhints">← → navigate · Space pause · F fullscreen</div>
  </div>
</div>

const MAGMA = [
  [0,0,4],[20,11,52],[58,9,99],[96,19,110],[134,36,108],
  [168,56,96],[200,78,78],[228,107,50],[246,148,18],[252,200,74],[252,253,191]
];
function magmaRgb(v, mx) {
  if (v < 25) return [7,11,20];
  const t = Math.min(1, v/mx);
  const i = Math.min(Math.floor(t*10), 9), f = t*10-i;
  return [0,1,2].map(j => Math.round(MAGMA[i][j]+f*(MAGMA[i+1][j]-MAGMA[i][j])));
}

// ── Costmap painter ─────────────────────────────────────────────────────────
function paintMap(canvas, data, base, revealFrac) {
  const H=data.length, W=data[0].length;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");
  const img=ctx.createImageData(W,H);
  const total=H*W, revealed=Math.floor(total*revealFrac);
  for (let i=0;i<total;i++) {
    const r=Math.floor(i/W), c=i%W;
    let rgb;
    if (i>revealed)              rgb=[7,11,20];
    else if (base[r][c]>=255)    rgb=[220,225,255];
    else                         rgb=magmaRgb(data[r][c],245);
    const p=i*4;
    img.data[p]=rgb[0]; img.data[p+1]=rgb[1]; img.data[p+2]=rgb[2]; img.data[p+3]=255;
  }
  ctx.putImageData(img,0,0);
}

// ── Path drawer ─────────────────────────────────────────────────────────────
function drawPath(ctx, path, frac, color, dash) {
  if (!path||path.length<2) return;
  const n=Math.max(2,Math.ceil(path.length*frac));
  ctx.beginPath();
  ctx.strokeStyle=color; ctx.lineWidth=dash?1.5:2.2;
  if (dash) ctx.setLineDash([3,2]); else ctx.setLineDash([]);
  ctx.moveTo(path[0][0],path[0][1]);
  for (let k=1;k<n;k++) ctx.lineTo(path[k][0],path[k][1]);
  ctx.stroke(); ctx.setLineDash([]);
}

// ── Robot animator ──────────────────────────────────────────────────────────
function drawRobot(ctx, path, t) {
  if (!path||path.length<2||t<=0) return;
  const raw=(path.length-1)*t;
  const idx=Math.min(Math.floor(raw), path.length-2);
  const frac=raw-idx;
  const p1=path[idx], p2=path[idx+1];
  const rx=p1[0]+(p2[0]-p1[0])*frac;
  const ry=p1[1]+(p2[1]-p1[1])*frac;

  // glowing trail
  const trailEnd=Math.ceil(raw);
  ctx.beginPath();
  ctx.strokeStyle="rgba(103,232,249,0.35)"; ctx.lineWidth=2.5;
  ctx.moveTo(path[0][0],path[0][1]);
  for (let k=1;k<=trailEnd&&k<path.length;k++) ctx.lineTo(path[k][0],path[k][1]);
  ctx.lineTo(rx,ry); ctx.stroke();

  // heading angle
  const angle=Math.atan2(p2[1]-p1[1], p2[0]-p1[0]);
  const sz=3.5;
  ctx.save();
  ctx.translate(rx,ry); ctx.rotate(angle+Math.PI/2);
  ctx.fillStyle="#67e8f9";
  ctx.beginPath();
  ctx.moveTo(0,-sz); ctx.lineTo(-sz*0.6,sz*0.7); ctx.lineTo(sz*0.6,sz*0.7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

  ctx.font="5px sans-serif"; ctx.textAlign="center";

}

  robot: 9000,
  hold: 18000,
};

function ease(t) { return t<.5?2*t*t:-1+(4-2*t)*t; }
function clamp(t) { return Math.max(0,Math.min(1,t)); }
function pt(e,s,end) { return ease(clamp((e-s)/Math.max(1,end-s))); }
function lerp(a,b,t) { return Math.round(a+(b-a)*t); }

let curFrame=0, tStart=null, paused=false, lastFrame=-1;

const PHASE_LABELS = ["Costmap", "Baseline path", "VLM-enhanced path", "Robot following path", "Complete"];

function phaseIndex(elapsed) {
  if (elapsed < PH.map)   return 0;
  if (elapsed < PH.base)  return 0;
  if (elapsed < PH.enh)   return 1;
  if (elapsed < PH.robot) return 2;
  if (elapsed < PH.hold)  return 3;
  return 4;
}

function renderMetrics(frame, t) {
  const bm=frame.baseline_metrics, em=frame.enhanced_metrics;
  const delta=bm.risk_score-em.risk_score;
  document.getElementById("metrics").innerHTML=`
    <div class="mcard"><h4>Baseline risk</h4>
      <div class="mval base">${lerp(0,bm.risk_score,t)}/100</div></div>
    <div class="mcard"><h4>VLM-enhanced risk</h4>
      <div class="mval enh">${lerp(0,em.risk_score,t)}/100</div></div>
    <div class="mcard"><h4>Risk reduction</h4>
      <div class="mval delta">${delta>0?"↓ "+lerp(0,delta,t)+" pts":"—"}</div></div>`;
}

function tick(ts) {
  if (paused) { requestAnimationFrame(tick); return; }
  if (tStart===null) tStart=ts;
  const elapsed=ts-tStart;
  const frame=FRAMES[curFrame];

  // camera
  const camT=pt(elapsed,PH.cam,PH.cam+700);
  const img=document.getElementById("cameraImg");
  if (curFrame!==lastFrame) {
    img.src=frame.camera_url;
    lastFrame=curFrame;
    document.getElementById("metrics").innerHTML="";
    document.getElementById("sceneText").textContent="";
    document.getElementById("navAdvice").textContent="";
  }
  img.style.opacity=camT;
  if (camT>.7) document.getElementById("sceneText").textContent=frame.scene;
  if (camT>.9) document.getElementById("navAdvice").textContent=frame.nav_advice;

  // costmap
  const mapT =pt(elapsed,PH.map, PH.base);
  const baseT=pt(elapsed,PH.base,PH.enh);
  const enhT =pt(elapsed,PH.enh, PH.robot);
  const robT =pt(elapsed,PH.robot,PH.hold);

  const canvas=document.getElementById("globalCanvas");
  paintMap(canvas,frame.enhanced_costmap,frame.base_costmap,mapT);
  if (mapT>.05) {
    const ctx=canvas.getContext("2d");
    if (baseT>0) drawPath(ctx,frame.baseline_path,baseT,"rgba(56,189,248,0.8)",true);
    if (enhT>0)  drawPath(ctx,frame.enhanced_path,enhT,"rgba(248,250,252,0.95)",false);
    if (robT>0)  drawRobot(ctx,frame.enhanced_path,robT);
    drawMarkers(ctx,frame);
  }

  // phase label
  document.getElementById("phaseLabel").textContent=PHASE_LABELS[phaseIndex(elapsed)];

  // metrics appear when paths are drawn
  const metT=pt(elapsed,PH.enh,PH.robot);
  if (metT>0) renderMetrics(frame,metT);

  // footer
  document.getElementById("progressFill").style.width=(elapsed/DURATION*100)+"%";
  document.getElementById("scenTitle").textContent=frame.title;
  document.getElementById("scenSummary").textContent=frame.summary;

  if (elapsed>=DURATION) {
    curFrame=(curFrame+1)%FRAMES.length;
    tStart=ts; updateDots();
  }
  requestAnimationFrame(tick);
}

// ── Controls ─────────────────────────────────────────────────────────────────
function updateDots() {
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active",i===curFrame));
}
function jumpTo(idx) {
  curFrame=(idx+FRAMES.length)%FRAMES.length;
  tStart=null; lastFrame=-1; updateDots();
}

document.getElementById("pauseBtn").addEventListener("click",()=>{
  paused=!paused;
  document.getElementById("pauseBtn").textContent=paused?"▶ Resume":"⏸ Pause";
});
document.getElementById("fsBtn").addEventListener("click",()=>{
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
document.addEventListener("keydown",e=>{
  if      (e.key===" ")          { paused=!paused; document.getElementById("pauseBtn").textContent=paused?"▶ Resume":"⏸ Pause"; }
  else if (e.key==="ArrowRight") jumpTo(curFrame+1);
  else if (e.key==="ArrowLeft")  jumpTo(curFrame-1);
  else if (e.key==="f"||e.key==="F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

// ── Init ─────────────────────────────────────────────────────────────────────
const dotsEl=document.getElementById("dots");
FRAMES.forEach((_,i)=>{
  const d=document.createElement("div");
  d.className="dot"+(i===0?" active":"");
  dotsEl.appendChild(d);
});
requestAnimationFrame(tick);
</script>
</body>
</html>
